<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IDS-Connected Firewall — Manage blocked IP addresses">
    <title>Blocked IPs — IDS Firewall</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- ── Sidebar ──────────────────────────────────────────── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">🛡️</div>
                <div>
                    <h1>IDS Firewall</h1>
                    <span class="version">v1.0.0</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">Monitoring</div>
                <a href="/" class="nav-link">
                    <span class="nav-icon">📊</span><span>Dashboard</span>
                </a>
                <a href="/blocked" class="nav-link active">
                    <span class="nav-icon">🚫</span><span>Blocked IPs</span>
                </a>
                <div class="nav-section-title">Management</div>
                <a href="/rules" class="nav-link">
                    <span class="nav-icon">📋</span><span>Firewall Rules</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <span>🚪</span><span>Log Out</span>
                </button>
            </div>
        </aside>

        <!-- ── Header ───────────────────────────────────────────── -->
        <header class="header">
            <div class="header-left">
                <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
                <h2 class="header-title">Blocked IP Management</h2>
            </div>
            <div class="header-right">
                <div class="threat-indicator level-low" id="threatIndicator">
                    <span class="threat-dot"></span>
                    <span id="threatText">LOW</span>
                </div>
            </div>
        </header>

        <!-- ── Main Content ─────────────────────────────────────── -->
        <main class="main-content">
            <div class="action-bar">
                <div>
                    <div class="page-title">Blocked IP Addresses</div>
                    <div class="page-subtitle">Auto-blocked by IDS and manually blocked IPs</div>
                </div>
                <button class="btn btn-primary" onclick="openBlockModal()">
                    ➕ Block IP
                </button>
            </div>

            <div class="data-table-container">
                <table class="data-table" id="blockedTable">
                    <thead>
                        <tr>
                            <th>IP Address</th>
                            <th>Reason</th>
                            <th>Blocked At</th>
                            <th>Expires</th>
                            <th>Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="blockedTableBody">
                        <tr>
                            <td colspan="6">
                                <div class="empty-state">
                                    <div class="empty-icon">✅</div>
                                    <p>No blocked IPs</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ── Block IP Modal ───────────────────────────────────────── -->
    <div class="modal-overlay hidden" id="blockModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Block IP Address</h3>
                <button class="modal-close" onclick="closeBlockModal()">✕</button>
            </div>
            <form id="blockForm">
                <div class="form-group">
                    <label class="form-label" for="blockIp">IP Address</label>
                    <input type="text" id="blockIp" class="form-input" placeholder="e.g. 192.168.1.100" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="blockReason">Reason</label>
                    <input type="text" id="blockReason" class="form-input" placeholder="Why is this IP being blocked?" value="Manual block from dashboard">
                </div>
                <div class="form-group">
                    <label class="form-label" for="blockType">Block Type</label>
                    <select id="blockType" class="form-select" onchange="toggleTTL()">
                        <option value="permanent">Permanent</option>
                        <option value="temporary">Temporary</option>
                    </select>
                </div>
                <div class="form-group" id="ttlGroup" style="display:none">
                    <label class="form-label" for="blockTTL">Duration (seconds)</label>
                    <input type="number" id="blockTTL" class="form-input" placeholder="e.g. 1800 (30 min)" min="60" value="1800">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeBlockModal()">Cancel</button>
                    <button type="submit" class="btn btn-danger">🚫 Block IP</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        /* ── Auth guard ────────────────────────────────────────── */
        const token = localStorage.getItem('ids_token');
        if (!token) { window.location.href = '/login'; }

        const API_BASE = '';

        function authHeaders() {
            return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
        }

        function logout() {
            localStorage.removeItem('ids_token');
            window.location.href = '/login';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
        }

        /* ── Load blocked IPs ──────────────────────────────────── */
        async function loadBlocked() {
            try {
                const res = await fetch(API_BASE + '/api/blocked', { headers: authHeaders() });
                if (res.status === 401) { logout(); return; }
                const data = await res.json();
                renderTable(data);
            } catch (e) {
                console.error('Failed to load blocked IPs:', e);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('blockedTableBody');
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">✅</div><p>No blocked IPs</p></div></td></tr>';
                return;
            }
            tbody.innerHTML = data.map(b => `
                <tr>
                    <td class="ip-cell">${b.ip_address}</td>
                    <td>${escapeHtml(b.reason).substring(0, 80)}</td>
                    <td class="text-muted">${formatDate(b.blocked_at)}</td>
                    <td class="text-muted">${b.expires_at ? formatDate(b.expires_at) : '—'}</td>
                    <td>
                        <span class="table-badge ${b.is_permanent ? 'permanent' : 'temporary'}">
                            ${b.is_permanent ? 'Permanent' : 'Temporary'}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="unblockIP('${b.ip_address}')">
                            Unblock
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        /* ── Block IP ──────────────────────────────────────────── */
        function openBlockModal() { document.getElementById('blockModal').classList.remove('hidden'); }
        function closeBlockModal() { document.getElementById('blockModal').classList.add('hidden'); }
        function toggleTTL() {
            document.getElementById('ttlGroup').style.display =
                document.getElementById('blockType').value === 'temporary' ? 'block' : 'none';
        }

        document.getElementById('blockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const isPerm = document.getElementById('blockType').value === 'permanent';
            const body = {
                ip_address: document.getElementById('blockIp').value,
                reason: document.getElementById('blockReason').value,
                is_permanent: isPerm,
            };
            if (!isPerm) {
                body.ttl_seconds = parseInt(document.getElementById('blockTTL').value) || 1800;
            }
            try {
                const res = await fetch(API_BASE + '/api/block', {
                    method: 'POST', headers: authHeaders(), body: JSON.stringify(body),
                });
                if (res.ok) {
                    closeBlockModal();
                    loadBlocked();
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Failed to block IP');
                }
            } catch (e) {
                alert('Network error');
            }
        });

        /* ── Unblock IP ────────────────────────────────────────── */
        async function unblockIP(ip) {
            if (!confirm(`Unblock ${ip}?`)) return;
            try {
                const res = await fetch(API_BASE + '/api/unblock', {
                    method: 'POST', headers: authHeaders(),
                    body: JSON.stringify({ ip_address: ip }),
                });
                if (res.ok) { loadBlocked(); }
                else {
                    const err = await res.json();
                    alert(err.detail || 'Failed to unblock');
                }
            } catch (e) {
                alert('Network error');
            }
        }

        /* ── Helpers ───────────────────────────────────────────── */
        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleString();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /* ── Init ──────────────────────────────────────────────── */
        loadBlocked();
        setInterval(loadBlocked, 15000);
    </script>
</body>
</html>
