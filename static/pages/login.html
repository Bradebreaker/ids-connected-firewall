<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IDS-Connected Firewall — Login to the security dashboard">
    <title>Login — IDS Firewall Dashboard</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🛡️</div>
                <h2>IDS Firewall</h2>
                <p>Sign in to the security dashboard</p>
            </div>

            <div id="loginError" class="login-error"></div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        class="form-input"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                    Sign In
                </button>
            </form>

            <p style="text-align:center; margin-top:20px; font-size:0.75rem; color:var(--text-muted);">
                Default credentials: admin / admin123
            </p>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
